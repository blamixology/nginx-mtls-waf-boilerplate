user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format edge_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"request_id":"$request_id",'
        '"client_verify":"$ssl_client_verify","client_dn":"$ssl_client_s_dn"}';
    access_log /var/log/nginx/access.log edge_json;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;

    # Educational request denylist. This is not a replacement for a maintained WAF.
    map $request_uri $deny_request {
        default 0;
        ~*(?:\.\./|%2e%2e%2f|<script|%3cscript|union(?:%20|\+)select) 1;
    }

    include /etc/nginx/conf.d/*.conf;
}

